<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfcfd;--ink:#0f1216;--ink-2:#454b57;--ink-3:#6b717d;
  --line:#e6e8ec;--line-2:#d6d9df;--accent:#5b4bd6;--accent-2:#efedfd;--accent-ink:#3a2fa8;
  --teal:#0f9e75;--teal-bg:#e3f6ef;--amber:#b8790f;--amber-bg:#fbefda;--pink:#c23a68;--pink-bg:#fbe9f0;
  --blue:#2f6fd0;--blue-bg:#e8f0fb;--green:#3b8a1f;--green-bg:#eaf5e2;--gold:#a06a12;--gold-bg:#f8efd8;
  --shadow:0 1px 2px rgba(16,19,24,.04),0 6px 22px rgba(16,19,24,.07);
  --radius:16px;--maxw:760px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
[data-theme="dark"]{
  --bg:#0c0e13;--panel:#151821;--panel-2:#1a1e28;--ink:#f2f4f8;--ink-2:#b4bac6;--ink-3:#7a818e;
  --line:#252a35;--line-2:#333a48;--accent:#8e83f0;--accent-2:#211f3c;--accent-ink:#bcb4fb;
  --teal:#3ec79b;--teal-bg:#123027;--amber:#e0a63f;--amber-bg:#332612;--pink:#e97aa2;--pink-bg:#331722;
  --blue:#6aa3ec;--blue-bg:#122237;--green:#7cc65a;--green-bg:#1a2c11;--gold:#d9ab54;--gold-bg:#2e2513;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;font-size:17px}
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#8b5cf6);width:0;z-index:100;transition:width .1s}
/* top bar */
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hb{max-width:1120px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}.tmark{position:relative;display:block;width:46px;height:31px;flex:none}.tword{position:relative;display:block;width:66px;height:13px;flex:none}.tword img{position:absolute;inset:0;width:100%;height:100%}.tword .tmk-white{display:none}[data-theme="dark"] .tword .tmk-ink{display:none}[data-theme="dark"] .tword .tmk-white{display:block}.tsep{width:1px;height:20px;background:var(--line-2);flex:none}.tmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.tmark .tmk-white{display:none}[data-theme="dark"] .tmark .tmk-ink{display:none}[data-theme="dark"] .tmark .tmk-white{display:block}.tname{font-weight:800;letter-spacing:-.02em;color:var(--ink)}.tdot{color:var(--ink-3);font-weight:400;margin:0 1px}
.brand b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.hb .sp{flex:1}
.hb a.back{font-size:13px;color:var(--ink-2);text-decoration:none;font-weight:550}
.hb a.back:hover{color:var(--accent-ink)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:15px}
/* layout */
.shell{max-width:1120px;margin:0 auto;padding:0 22px;display:grid;grid-template-columns:230px 1fr;gap:44px;align-items:start}
nav.toc{position:sticky;top:72px;padding-top:44px;font-size:13.5px}
nav.toc .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:650;margin-bottom:12px}
nav.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:6px 0 6px 13px;border-left:2px solid var(--line);line-height:1.35}
nav.toc a:hover{color:var(--ink)}
nav.toc a.on{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
main{max-width:var(--maxw);padding:44px 0 100px;min-width:0}
/* type */
h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin-bottom:18px}
h2{font-size:30px;line-height:1.15;letter-spacing:-.02em;font-weight:750;margin:0 0 8px}
h3{font-size:21px;letter-spacing:-.01em;font-weight:700;margin:34px 0 10px}
h4{font-size:16px;font-weight:700;margin:22px 0 6px}
p{margin:0 0 18px;color:var(--ink)}
p.sub{font-size:20px;color:var(--ink-2);line-height:1.55}
.lead{font-size:19px;color:var(--ink-2)}
strong{font-weight:700}
em{font-style:normal;background:var(--gold-bg);color:var(--gold);padding:0 4px;border-radius:4px;font-weight:600}
a.tlink{color:var(--accent-ink);font-weight:600}
ul,ol{margin:0 0 18px;padding-left:2px;list-style:none}
li{position:relative;padding-left:30px;margin-bottom:12px}
ul li::before{content:"";position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
ol{counter-reset:s}
ol li{counter-increment:s}
ol li::before{content:counter(s);position:absolute;left:0;top:2px;width:23px;height:23px;border-radius:7px;background:var(--accent-2);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
/* chapter head */
.chap{margin:0 0 6px;display:flex;align-items:center;gap:16px}
.chap .no{font-size:13px;font-weight:750;color:var(--accent-ink);background:var(--accent-2);border-radius:20px;padding:5px 13px;white-space:nowrap}
.chap .tag{font-size:12px;color:var(--ink-3);font-weight:600}
section.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
section.reveal.in{opacity:1;transform:none}
.divider{height:1px;background:var(--line);margin:60px 0}
/* callouts */
.box{border-radius:14px;padding:18px 20px;margin:24px 0;font-size:16px;line-height:1.6}
.box .h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.box p:last-child{margin-bottom:0}
.tip{background:var(--amber-bg)}.tip .h{color:var(--amber)}
.why{background:var(--blue-bg)}.why .h{color:var(--blue)}
.eg{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.eg .h{color:var(--ink-3)}
.do{background:var(--teal-bg)}.do .h{color:var(--teal)}
.deep{background:var(--accent-2)}.deep .h{color:var(--accent-ink)}
/* cards & grids */
.grid{display:grid;gap:14px;margin:22px 0}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card .n{font-size:12px;font-weight:700;color:var(--accent-ink)}
.card b{display:block;font-size:16px;margin:5px 0 4px}
.card span{font-size:14px;color:var(--ink-2);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;border-radius:20px;padding:4px 11px;background:var(--accent-2);color:var(--accent-ink)}
.pill.te{background:var(--teal-bg);color:var(--teal)}.pill.am{background:var(--amber-bg);color:var(--amber)}.pill.bl{background:var(--blue-bg);color:var(--blue)}.pill.gd{background:var(--gold-bg);color:var(--gold)}
/* funnel diagram */
.funnel{margin:26px 0;display:flex;flex-direction:column;align-items:center;gap:0}
.frow{width:100%;text-align:center;border-radius:12px;padding:15px;font-weight:650;color:#fff;position:relative}
.frow small{display:block;font-weight:500;font-size:13px;opacity:.92;margin-top:2px}
.f1{background:#6366f1;width:100%}.f2{background:#7c5cea;width:84%}.f3{background:#9333ea;width:68%}.f4{background:#0f9e75;width:52%}
.farrow{color:var(--ink-3);font-size:15px;padding:5px}
/* stat row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:12.5px;color:var(--ink-3);margin-top:3px}
/* calculator */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin:26px 0}
.calc .row{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.calc label{flex:none;width:150px;font-size:14px;color:var(--ink-2);font-weight:550}
.calc input[type=range]{flex:1;accent-color:var(--accent)}
.calc .out{flex:none;width:74px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.calc .res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.calc .res .b{background:var(--accent-2);border-radius:12px;padding:15px}
.calc .res .b.g{background:var(--teal-bg)}
.calc .res .k{font-size:12.5px;color:var(--ink-3)}
.calc .res .v{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink)}
.calc .res .b.g .v{color:var(--teal)}
.calc .res{grid-template-columns:repeat(3,minmax(0,1fr))}
/* EQ-CSS:START (generated by build/equations.py) */
.eqs{border-top:1px solid var(--line);padding:16px 0 14px;max-width:820px}
.eqs-h{font-size:17px;font-weight:750;color:var(--ink);margin-bottom:6px}.eqs-h span{color:var(--ink-3);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.eqs-m{margin:0 0 10px;font-size:15.5px;color:var(--ink)}
.eqs-eq{background:var(--panel-2);border-radius:12px;padding:10px 14px;margin:0 0 10px;max-width:820px}
.eqs-l{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.75;color:var(--ink);overflow-wrap:anywhere}
.eqs-l sub,.eqs-k sub,.eqs-m sub,td sub{font-size:.72em}
.eqs-k{list-style:none;margin:0;padding:0;columns:2 300px;column-gap:28px;max-width:820px}
.eqs-k li{display:grid;grid-template-columns:64px minmax(0,1fr);margin:0 0 4px;padding:0;font-size:14px;line-height:1.45;color:var(--ink-2);break-inside:avoid}.eqs-k li::before{content:none;display:none}
.eqs-k i{font-style:normal;color:var(--ink);font-weight:600}.eqs-k b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.eqs-w{border-top:2px solid var(--ink)}
.eqlist{margin:8px 0 0;padding-left:18px}.eqlist li{margin:5px 0;font-size:15px}
.eqmodel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:24px 0;font-size:14.5px}
.eqm-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.eqm-tabs{display:flex;flex-wrap:wrap;gap:6px}.eqm-tabs button,.eqm-reset{font:inherit;font-size:14px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:8px 15px;cursor:pointer;min-height:40px}
.eqm-tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.eqm-reset{background:none}
.eqm-chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.eqm-t{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.eqm-t b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}.eqm-t span{font-size:12.5px;color:var(--ink-2);line-height:1.3}.eqm-t small{font-size:12px;color:var(--ink-3)}
.eqm-t .eqm-s{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.eqm-econ{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}.eqm-econ div{padding:4px 2px}.eqm-econ span{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}.eqm-econ b{font-size:17px;font-variant-numeric:tabular-nums}
.eqm-h{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.eqm-list{margin:0;padding-left:22px}.eqm-list li{margin:6px 0;font-size:14.5px}
.eqm-st{border-top:1px solid var(--line);padding:8px 0}.eqm-st>summary{cursor:pointer;font-weight:650;padding:6px 0}.eqm-st>summary span{color:var(--ink-3);font-weight:500}
.eqm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px;margin-top:8px}
.eqm-in{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}.eqm-l{min-width:0}
.eqm-v{display:flex;align-items:center;gap:4px;flex:none}.eqm-v input{width:88px;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.eqm-v i{font-style:normal;color:var(--ink-3);width:12px}
@media(max-width:760px){.eqm-chain,.eqm-econ{grid-template-columns:repeat(2,minmax(0,1fr))}.eqs-k{columns:1}}
/* EQ-CSS:END */
.calcnote{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.55;background:var(--panel-2);color:var(--ink-2)}
.calcnote.g{background:var(--teal-bg);color:var(--teal)}
.calcnote.a{background:var(--amber-bg);color:var(--amber)}
.calcnote.r{background:var(--pink-bg);color:var(--pink)}
.chkwrap{margin:26px 0}
.chkwrap.dayplan{margin:22px 0 34px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chkwrap.dayplan .chkday{margin-bottom:0}
.chkday{margin-bottom:26px}
.chkh{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:2px}
.chkh b{font-size:17px;letter-spacing:-.01em}
.chkh .chkmeta{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.chkwrap .tbl{margin:10px 0 0}
.chkwrap .tbl td:first-child,.chkwrap .tbl th:first-child{width:34px;padding-right:0}
.chkwrap input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin-top:1px}
.chkwrap tr.done td{opacity:.45}
.chkwrap tr.done td b{text-decoration:line-through}
.hw{display:inline-block;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;background:var(--amber-bg);color:var(--amber);border-radius:5px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.hero-funnel{margin-top:30px}
/* ---- world-class SVG viz system ---- */
.viz{margin:28px 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px 16px;box-shadow:var(--shadow);overflow:hidden}
.viz.wide{background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
/* figure sizing (round 5, #11): a diagram never draws below 640px (about 75% of its size), so its
   labels stay readable; on phones the frame scrolls sideways instead of shrinking the type. Same rule
   as the onboarding centre (build/embed.py). */
@media(max-width:700px){.viz{overflow-x:auto;-webkit-overflow-scrolling:touch}.viz svg{min-width:640px}
  .viz{cursor:zoom-in}.viz::after{content:"Tap the diagram to open it full screen";display:block;margin-top:8px;font-size:12px;color:var(--ink-3);text-align:center}}
.pb-zoom{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:56px 16px 24px}
.pb-zoom .pb-zoom-box{width:900px}
.pb-zoom svg{display:block;width:900px;height:auto}
.pb-zoom .pb-zoom-x{position:fixed;top:10px;right:12px;z-index:1;border-radius:999px;padding:8px 16px;font:700 14px/1 system-ui,sans-serif;background:var(--accent);color:#fff;border:0}
.viz .cap{font-size:12.5px;color:var(--ink-3);margin-top:12px;text-align:center;line-height:1.5}
.viz .cap b{color:var(--ink-2);font-weight:650}
.vtitle{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.vtitle::before{content:"";width:16px;height:2px;background:var(--accent);border-radius:2px}
svg text{font-family:var(--sans);dominant-baseline:middle}
.svlabel{fill:var(--ink);font-weight:700}
.svsub{fill:var(--ink-2)}
.svmute{fill:var(--ink-3)}
.svwhite{fill:#fff;font-weight:700}
.svwhite2{fill:rgba(255,255,255,.85)}
.node{fill:var(--panel);stroke:var(--line-2)}
.gridline{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--line-2);stroke-width:1.5}
.flowline{stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 44s linear infinite}
@keyframes spinr{to{transform:rotate(-360deg)}}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 60s linear infinite}
@keyframes dashdraw{to{stroke-dashoffset:0}}
.legend2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* ---- funnel-variant callout: what changes per funnel type ---- */
.fvar{margin:26px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.fvar .fh{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;padding:11px 16px;background:var(--accent-2);color:var(--accent-ink)}
.fvar .fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.fvar .fc{padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.fvar .fc:last-child{border-right:none}
.fvar .fc b{display:block;font-size:13px;margin-bottom:5px;letter-spacing:-.01em}
.fvar .fc span{font-size:13.5px;color:var(--ink-2);line-height:1.55;display:block}
.fvar .fc.w b{color:var(--accent-ink)}.fvar .fc.k b{color:var(--teal)}.fvar .fc.r b{color:var(--pink)}
.fvar .fo{padding:11px 16px;border-top:1px solid var(--line);background:var(--panel-2);font-size:13px;color:var(--ink-3);line-height:1.55}
.fvar .fo b{color:var(--ink-2);font-weight:650}
/* ---- data table ---- */
.tbl{margin:24px 0;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.tbl table{width:100%;border-collapse:collapse;min-width:500px;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:750;padding:11px 14px;border-bottom:1.5px solid var(--line-2);background:var(--panel-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;line-height:1.5}
.tbl td b{color:var(--ink);font-weight:650}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* ---- task block: step + owner + tool + time + deliverable + proof ---- */
.task{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);margin:20px 0;overflow:hidden}
.task .th{padding:13px 17px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.task .th .tn{font-size:11.5px;font-weight:750;color:var(--accent-ink);background:var(--accent-2);border-radius:20px;padding:3px 10px;white-space:nowrap}
.task .th b{font-size:15.5px;letter-spacing:-.01em}
.task .tm{padding:15px 17px 4px}
.task .tm p{margin:0 0 12px;font-size:15.5px;line-height:1.62}
.task .tm ul,.task .tm ol{margin-bottom:12px}
.task .tm li{font-size:15px;margin-bottom:8px}
.task .meta{display:flex;flex-wrap:wrap;gap:7px;padding:4px 17px 15px}
